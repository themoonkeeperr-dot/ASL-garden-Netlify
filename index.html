<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>ASL Garden</title>
    <meta name="description" content="ASL Garden is an independent visual learning resource for American Sign Language, with alphabet, numbers, vocabulary, games, conversations, food, and stories." />
    <meta name="theme-color" content="#497f92" />
    <meta name="author" content="ASL Garden" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="ASL Garden" />
    <meta property="og:description" content="A joyful visual-first garden for learning American Sign Language." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ASL Garden" />
    <meta name="twitter:description" content="A joyful visual-first garden for learning American Sign Language." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Static form declaration lets Netlify Forms detect the React contact form. -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" />
      <input name="topic" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
